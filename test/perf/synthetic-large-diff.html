<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Diff Risk Highlighter — perf harness</title>
<style>
  body { font-family: monospace; font-size: 13px; padding: 16px; }
  #results { white-space: pre; background: #f6f8fa; padding: 12px; border-radius: 6px; }
  #files { display: none; } /* generated DOM doesn't need to be seen for a timing run */
</style>
</head>
<body>
<h3>Diff Risk Highlighter — synthetic large-diff perf harness</h3>
<p>
  Not run under <code>node --test</code> (needs a real DOM). Open this file in a
  browser and read the numbers below, or drive it via the Browser tool's
  javascript_tool and read <code>window.__perfResults</code>.
</p>
<div id="results">running…</div>
<div class="pr-toolbar" style="height: 60px;"></div>
<div id="files" class="diff-view js-diff-container"></div>

<script>
  // ---- config ----
  const FILE_COUNT = 150;
  const HUNKS_PER_FILE = 3;
  const LINES_PER_HUNK = 12; // mix of added/removed

  // ---- generate a realistic-shaped synthetic diff ----
  const LINE_TEMPLATES = [
    (i) => `    const value${i} = compute(input${i});`,
    (i) => `    if (value${i} > threshold) {`,
    (i) => `        return value${i};`,
    (i) => `    }`,
    (i) => `    try {`,
    (i) => `        risky${i}();`,
    (i) => `    } catch (err) {`,
    (i) => `        log(err);`,
    (i) => `    }`,
    (i) => `    // recompute derived state for item ${i}`,
    (i) => `    items.push(makeItem(${i}, name${i}));`,
    (i) => `    total += weight${i} * factor${i};`,
  ];

  function buildHunkRowsHtml(fileIdx, hunkIdx) {
    let html = `<tr><td class="blob-num blob-num-expandable" colspan="2"></td><td class="blob-code blob-code-inner blob-code-hunk">@@ -${hunkIdx * 20},${LINES_PER_HUNK} +${hunkIdx * 20},${LINES_PER_HUNK} @@</td></tr>`;
    for (let i = 0; i < LINES_PER_HUNK; i++) {
      const text = LINE_TEMPLATES[(fileIdx + hunkIdx + i) % LINE_TEMPLATES.length](fileIdx * 100 + hunkIdx * 10 + i);
      const isAddition = i % 3 !== 0; // ~2/3 additions, 1/3 deletions — avoid pure-rename/formatting false shortcuts
      const cls = isAddition ? 'blob-code-addition' : 'blob-code-deletion';
      const marker = isAddition ? '+' : '-';
      html += `<tr><td class="blob-num blob-num-${isAddition ? 'addition' : 'deletion'}"></td><td class="blob-num"></td><td class="blob-code ${cls}"><span class="blob-code-inner blob-code-marker" data-code-marker="${marker}">${text}</span></td></tr>`;
    }
    return html;
  }

  function buildFileHtml(fileIdx) {
    const path = `src/module_${fileIdx}/file_${fileIdx}.js`;
    let hunksHtml = '';
    for (let h = 0; h < HUNKS_PER_FILE; h++) hunksHtml += buildHunkRowsHtml(fileIdx, h);
    return `
      <div class="file" data-tagsearch-path="${path}" data-file-type=".js" data-file-deleted="false">
        <div class="file-header" data-path="${path}"></div>
        <table class="diff-table">
          <tbody>${hunksHtml}</tbody>
        </table>
      </div>
    `;
  }

  const filesContainer = document.getElementById('files');
  let allFilesHtml = '';
  for (let f = 0; f < FILE_COUNT; f++) allFilesHtml += buildFileHtml(f);
  filesContainer.innerHTML = allFilesHtml;

  const TOTAL_HUNKS = FILE_COUNT * HUNKS_PER_FILE;
</script>

<script src="../../src/risk-engine.js"></script>
<script>
  // ---- "naive" scan: Milestone 3 behavior — walks every row of every
  // file's table on every call, only skipping already-assessed individual
  // hunks (not whole files). ----
  function extractHunksFromFile(fileEl, table) {
    const filePath = fileEl.dataset.tagsearchPath;
    const hunks = [];
    let current = null;
    for (const row of table.querySelectorAll('tr')) {
      const hunkCell = row.querySelector('td.blob-code-hunk');
      if (hunkCell) {
        current = { filePath, headerRow: row, addedLines: [], removedLines: [] };
        hunks.push(current);
        continue;
      }
      if (!current) continue;
      const addInner = row.querySelector('td.blob-code-addition .blob-code-inner');
      if (addInner) current.addedLines.push(addInner.textContent);
      const delInner = row.querySelector('td.blob-code-deletion .blob-code-inner');
      if (delInner) current.removedLines.push(delInner.textContent);
    }
    return hunks;
  }

  function naiveScan() {
    const fileEls = document.querySelectorAll('.file[data-tagsearch-path]');
    for (const fileEl of fileEls) {
      const table = fileEl.querySelector('table.diff-table');
      if (!table) continue;
      const hunks = extractHunksFromFile(fileEl, table);
      for (const hunk of hunks) {
        if (hunk.headerRow.dataset.driskhProcessed) continue;
        DiffRiskEngine.assessHunk(hunk);
        hunk.headerRow.dataset.driskhProcessed = 'true';
      }
    }
  }

  // ---- "cached" scan: Milestone 4 behavior — cheap hunk-count check per
  // file skips the full row walk entirely for files with no new content. ----
  function countHunkHeaders(table) {
    return table.querySelectorAll('td.blob-code-hunk').length;
  }

  function cachedScan() {
    const fileEls = document.querySelectorAll('.file[data-tagsearch-path]');
    for (const fileEl of fileEls) {
      const table = fileEl.querySelector('table.diff-table');
      if (!table) continue;
      const currentCount = countHunkHeaders(table);
      const lastCount = Number(fileEl.dataset.driskhHunkCount || 0);
      if (currentCount === lastCount) continue;
      fileEl.dataset.driskhHunkCount = String(currentCount);
      const hunks = extractHunksFromFile(fileEl, table);
      for (const hunk of hunks) {
        if (hunk.headerRow.dataset.driskhProcessed) continue;
        DiffRiskEngine.assessHunk(hunk);
        hunk.headerRow.dataset.driskhProcessed = 'true';
      }
    }
  }

  function resetProcessedMarkers() {
    document.querySelectorAll('tr[data-driskh-processed]').forEach((r) => delete r.dataset.driskhProcessed);
    document.querySelectorAll('.file[data-driskh-hunk-count]').forEach((f) => delete f.dataset.driskhHunkCount);
  }

  function time(fn) {
    const t0 = performance.now();
    fn();
    return performance.now() - t0;
  }

  function median(arr) {
    const sorted = [...arr].sort((a, b) => a - b);
    return sorted[Math.floor(sorted.length / 2)];
  }

  // Cold-scan timing (first pass over freshly-generated DOM) turns out to
  // be dominated by one-time JIT/layout warmup noise, not the algorithm —
  // confirmed by re-running with naive/cached swapped and seeing the
  // "faster" one flip. It's reported for reference only. The number that
  // actually matters is the WARM rescan: what a MutationObserver-triggered
  // no-op rescan costs once the page has settled, which is the realistic,
  // repeated case on a live GitHub PR page (comments loading, "Viewed"
  // checkboxes, GitHub's own UI reacting to scroll — all fire the observer
  // even though none of the 150 files actually changed). That's measured
  // as a median over several repetitions instead of a single sample.
  const REPS = 8;
  const results = {};

  resetProcessedMarkers();
  results.naiveCold = time(naiveScan);
  const naiveWarmReps = [];
  for (let i = 0; i < REPS; i++) naiveWarmReps.push(time(naiveScan));
  results.naiveWarmMedian = median(naiveWarmReps);

  resetProcessedMarkers();
  results.cachedCold = time(cachedScan);
  const cachedWarmReps = [];
  for (let i = 0; i < REPS; i++) cachedWarmReps.push(time(cachedScan));
  results.cachedWarmMedian = median(cachedWarmReps);

  results.fileCount = FILE_COUNT;
  results.totalHunks = TOTAL_HUNKS;
  results.processedCount = document.querySelectorAll('tr[data-driskh-processed]').length;
  results.naiveWarmReps = naiveWarmReps;
  results.cachedWarmReps = cachedWarmReps;

  window.__perfResults = results;

  document.getElementById('results').textContent =
    `Synthetic diff: ${FILE_COUNT} files x ${HUNKS_PER_FILE} hunks = ${TOTAL_HUNKS} hunks\n` +
    `Hunks actually assessed: ${results.processedCount} (sanity check, should equal ${TOTAL_HUNKS})\n\n` +
    `cold scan, either version (~one-time JIT/layout noise, not a reliable\n` +
    `  before/after signal — swapping run order flips which looks faster):\n` +
    `    naive:  ${results.naiveCold.toFixed(1)}ms   cached: ${results.cachedCold.toFixed(1)}ms\n\n` +
    `warm no-op rescan, median of ${REPS} reps (the number that matters —\n` +
    `  this is what fires on every unrelated DOM mutation after first load):\n` +
    `    naive:  ${results.naiveWarmMedian.toFixed(2)}ms  [${naiveWarmReps.map((r) => r.toFixed(1)).join(', ')}]\n` +
    `    cached: ${results.cachedWarmMedian.toFixed(2)}ms  [${cachedWarmReps.map((r) => r.toFixed(1)).join(', ')}]\n\n` +
    `Speedup on a no-op rescan: ${(results.naiveWarmMedian / Math.max(results.cachedWarmMedian, 0.001)).toFixed(1)}x`;
</script>
</body>
</html>
