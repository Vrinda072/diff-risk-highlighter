<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1068 330" width="1068" height="330" role="img" aria-labelledby="t d">
  <title id="t">Measured results on 42 real pull requests</title>
  <desc id="d">Real-fix hunks flagged rose from 55 of 84 to 68 of 84. Non-fix hunks flagged high fell from 12 to 6.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .cap { font-size: 12px; fill: #8b949e; font-weight: 700; letter-spacing: .12em; }
      .h { font-size: 16px; font-weight: 700; fill: #f0f6fc; }
      .s { font-size: 12px; fill: #8b949e; }
      .k { font-size: 13px; fill: #c9d1d9; }
      .v { font-size: 15px; font-weight: 700; fill: #f0f6fc; }
    </style>
  </defs>
  <rect x=".6" y=".6" width="1066.8" height="328.8" rx="16" fill="#0d1117" stroke="#30363d"/>
  <text x="32" y="38" class="cap">MEASURED ON 42 REAL MERGED PRS</text>

  <!-- panel 1 -->
  <rect x="30" y="58" width="500" height="244" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="54" y="92" class="h">Real fixes flagged</text>
  <text x="54" y="112" class="s">hunks that metadata.json marks as the actual fix (84 total). Higher is better.</text>
  <text x="54" y="156" class="k">Before</text>
  <rect x="120" y="140" width="340" height="22" rx="6" fill="#21262d"/>
  <rect x="120" y="140" width="222.6" height="22" rx="6" fill="#6e7681"/>
  <text x="470" y="157" class="v">55</text>
  <text x="54" y="208" class="k">Now</text>
  <rect x="120" y="192" width="340" height="22" rx="6" fill="#21262d"/>
  <rect x="120" y="192" width="275.2" height="22" rx="6" fill="#3fb950"/>
  <text x="470" y="209" class="v" style="fill:#3fb950">68</text>
  <text x="54" y="262" class="s">65% → 81% of real fixes get a badge</text>
  <text x="54" y="282" class="s">on the same 42 fixtures, with 147 tests passing</text>

  <!-- panel 2 -->
  <rect x="546" y="58" width="492" height="244" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="570" y="92" class="h">False alarms at HIGH</text>
  <text x="570" y="112" class="s">non-fix hunks flagged high, excluding documented expected flags. Lower is better.</text>
  <text x="570" y="156" class="k">Before</text>
  <rect x="636" y="140" width="340" height="22" rx="6" fill="#21262d"/>
  <rect x="636" y="140" width="340" height="22" rx="6" fill="#6e7681"/>
  <text x="986" y="157" class="v">12</text>
  <text x="570" y="208" class="k">Now</text>
  <rect x="636" y="192" width="340" height="22" rx="6" fill="#21262d"/>
  <rect x="636" y="192" width="170" height="22" rx="6" fill="#3fb950"/>
  <text x="986" y="209" class="v" style="fill:#3fb950">6</text>
  <text x="570" y="262" class="s">half the noise, so the red badges you do see</text>
  <text x="570" y="282" class="s">are more likely to be worth the click</text>
</svg>
