name: test

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The unit suite uses only Node's built-in test runner, so there's
      # nothing to install. The Playwright E2E suite (npm run test:e2e)
      # hits live github.com and isn't run here.
      - run: npm test
