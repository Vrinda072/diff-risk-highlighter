name: live-github-smoke

# GitHub has already changed its diff markup once during this project. This
# runs the real extension against live pull requests every week so the next
# change shows up here first. Kept separate from the push CI because it
# depends on github.com. Signed out, so it covers the classic layout.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
